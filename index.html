      animation: page-leaf-next 1.04s cubic-bezier(.16,1,.3,1) both !important;
    }
    .book-page-shell-prev .book-turn-leaf {
      animation: page-leaf-prev 1.04s cubic-bezier(.16,1,.3,1) both !important;
    }
    .book-page-shell-en.book-page-shell-next .book-turn-leaf,
    .book-page-shell-en.book-page-shell-prev .book-turn-leaf {
      animation-duration: 1.18s !important;
      animation-timing-function: cubic-bezier(.18,.82,.18,1) !important;
    }
    .book-page-shell-next .book-curl-shadow {
      animation: book-curl-shadow-next 1.04s cubic-bezier(.16,1,.3,1) both !important;
    }
    .book-page-shell-prev .book-curl-shadow {
      animation: book-curl-shadow-prev 1.04s cubic-bezier(.16,1,.3,1) both !important;
    }
    @keyframes page-leaf-next {
      0% { transform: perspective(1800px) rotateY(0deg) translateX(0) skewY(0deg) scaleX(1); opacity: .98; filter: brightness(1); }
      18% { transform: perspective(1800px) rotateY(-24deg) translateX(-2%) skewY(-.4deg) scaleX(.995); opacity: .99; filter: brightness(1.04); }
      45% { transform: perspective(1800px) rotateY(-92deg) translateX(-20%) skewY(-1.8deg) scaleX(.93); opacity: .90; filter: brightness(.98); }
      72% { transform: perspective(1800px) rotateY(-146deg) translateX(-48%) skewY(-1deg) scaleX(.82); opacity: .42; filter: brightness(.90); }
      100% { transform: perspective(1800px) rotateY(-181deg) translateX(-70%) skewY(0deg) scaleX(.76); opacity: 0; filter: brightness(.84); }
    }
    @keyframes page-leaf-prev {
      0% { transform: perspective(1800px) rotateY(0deg) translateX(0) skewY(0deg) scaleX(1); opacity: .98; filter: brightness(1); }
      18% { transform: perspective(1800px) rotateY(24deg) translateX(2%) skewY(.4deg) scaleX(.995); opacity: .99; filter: brightness(1.04); }
      45% { transform: perspective(1800px) rotateY(92deg) translateX(20%) skewY(1.8deg) scaleX(.93); opacity: .90; filter: brightness(.98); }
      72% { transform: perspective(1800px) rotateY(146deg) translateX(48%) skewY(1deg) scaleX(.82); opacity: .42; filter: brightness(.90); }
      100% { transform: perspective(1800px) rotateY(181deg) translateX(70%) skewY(0deg) scaleX(.76); opacity: 0; filter: brightness(.84); }
    }
    @keyframes book-settle-next {
      0% { transform: perspective(1800px) rotateY(-3deg) translateX(5px); }
      68% { transform: perspective(1800px) rotateY(.8deg) translateX(-1px); }
      100% { transform: perspective(1800px) rotateY(0deg) translateX(0); }
    }
    @keyframes book-settle-prev {
      0% { transform: perspective(1800px) rotateY(3deg) translateX(-5px); }
      68% { transform: perspective(1800px) rotateY(-.8deg) translateX(1px); }
      100% { transform: perspective(1800px) rotateY(0deg) translateX(0); }
    }
    @keyframes book-curl-shadow-next {
      0%,100% { opacity: 0; transform: translateX(0) scaleX(.92); }
      35% { opacity: .82; transform: translateX(-9%) scaleX(1.04); }
      62% { opacity: .52; transform: translateX(8%) scaleX(.96); }
    }
    @keyframes book-curl-shadow-prev {
      0%,100% { opacity: 0; transform: translateX(0) scaleX(.92); }
      35% { opacity: .82; transform: translateX(9%) scaleX(1.04); }
      62% { opacity: .52; transform: translateX(-8%) scaleX(.96); }
    }

    /* Tablet/narrow desktop: center the phone canvas. */
    @media (min-width: 431px) and (max-width: 899px) {
      html, body { background: #e7e2d8; }
      #root { align-items: center; justify-content: center; }
      #root > div { width: 430px !important; max-width: 430px !important; }
    }
  </style>
</head>
<body>
<div id="root">
  <!-- Instant boot splash: shown before React/Babel finish compiling, auto-replaced on mount -->
  <div id="boot-splash" aria-label="加载中">
    <div class="boot-seal">签</div>
    <div class="boot-title">诗 签</div>
    <div class="boot-dots"><span></span><span></span><span></span></div>
    <div id="boot-slow" class="boot-slow">加载稍慢…</div>
  </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Firebase config (edit firebase-config.js) -->
<script src="firebase-config.js?v=2026.06.20-r73"></script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared data (THEMES, HEXAGRAMS, TAGS) -->
<script src="data.js?v=2026.06.20-r73"></script>
<script src="themes-extra.js?v=2026.06.20-r73"></script>
<script src="plan.js?v=2026.06.20-r73"></script>

<!-- UI components (load order matters) -->
<script type="text/babel" src="primitives.jsx?v=2026.06.20-r73"></script>
<script type="text/babel" src="screens-main.jsx?v=2026.06.20-r73"></script>
<script type="text/babel" src="screens-other.jsx?v=2026.06.20-r73"></script>
<script type="text/babel" src="enhancements.jsx?v=2026.06.20-r73"></script>

<!-- Real app -->
<script type="text/babel" src="app-real.jsx?v=2026.06.20-r73"></script>

<script>
  // Reveal a short hint if React still hasn't replaced the splash.
  var bootFailed = false;
  window.addEventListener('error', function () {
    bootFailed = true;
  });
  setTimeout(() => {
    var slow = document.getElementById('boot-slow');
    if (slow && document.getElementById('boot-splash')) slow.classList.add('show');
  }, 6500);

  setTimeout(() => {
    var slow = document.getElementById('boot-slow');
    if (!slow || !document.getElementById('boot-splash')) return;
    slow.classList.add('show');
    slow.innerHTML = (bootFailed ? '加载出错' : '加载未完成') + '<button type="button" id="boot-retry">重试</button>';
    document.getElementById('boot-retry')?.addEventListener('click', function () {
      location.reload();
    });
  }, 16000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(error => {
        console.warn('Service worker registration failed:', error);
      });
    });
  }
</script>

</body>
</html>
